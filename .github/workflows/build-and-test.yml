name: Build and Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-checks:
    name: Architecture checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        id: java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Set up Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run architecture tests without Docker
        id: tests
        run: ./gradlew :architecture-tests:test --no-daemon --console=plain --rerun-tasks

      # Gradle이 실패했으면 이 단계는 실행하지 않아 원래 실패를 유지한다.
      - name: Verify required operating checks ran
        id: report-check
        # 직전 단계에서 테스트를 재실행했다. 여기서는 그 결과를 읽으며 테스트는 UP-TO-DATE로 재사용한다.
        run: ./gradlew :architecture-tests:verifyArchitectureReport --no-daemon --console=plain

      - name: Upload architecture test reports
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-test-reports
          path: |
            architecture-tests/build/reports/tests/test/**
            architecture-tests/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Explain architecture result
        if: ${{ always() }}
        env:
          CI_SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CI_JAVA_OUTCOME: ${{ steps.java.outcome }}
          CI_GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          CI_TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CI_REPORT_CHECK_OUTCOME: ${{ steps.report-check.outcome }}
          CI_REPORTS_OUTCOME: ${{ steps.reports.outcome }}
        run: |
          first_failure="없음. skip·취소가 있으면 실행 여부를 따로 확인하세요."
          for stage in "소스 준비:$CI_SOURCE_OUTCOME" "Java 준비:$CI_JAVA_OUTCOME" "Gradle 준비:$CI_GRADLE_OUTCOME" "구조 검사:$CI_TESTS_OUTCOME" "필수 운영 검사 실행 확인:$CI_REPORT_CHECK_OUTCOME" "보고서 업로드:$CI_REPORTS_OUTCOME"; do
            if [[ "$stage" == *:failure ]]; then
              first_failure="${stage%:*}"
              break
            fi
          done
          {
            echo "### 구조 검사: 실패 이유부터 확인"
            echo "- 첫 실패 단계: **$first_failure**"
            echo "- 실제 이유: 해당 단계의 오류 메시지를 먼저 읽으세요. 구조 검사 실패라면 HTML의 실패 테스트와 XML 메시지를 대조하세요."
            echo "- 실행 상태: 구조 검사=$CI_TESTS_OUTCOME / 필수 운영 검사 실행 확인=$CI_REPORT_CHECK_OUTCOME / 보고서 업로드=$CI_REPORTS_OUTCOME"
            echo "- 기준 커밋: $GITHUB_SHA"
            echo '- 명령: `./gradlew :architecture-tests:test --no-daemon --console=plain --rerun-tasks`'
            echo '- 실행 확인: `./gradlew :architecture-tests:verifyArchitectureReport --no-daemon --console=plain`'
            echo '- 보고서: `architecture-test-reports` · HTML과 XML · 7일 보관. 생성 전 실패하면 보고서가 없을 수 있습니다.'
            echo '- 준비 오류·미평가라면 입력/출력을, 규칙 위반이라면 오류에 나온 운영 타입/의존을 확인하세요. 예제 기대값 실패는 검사기 테스트를 확인하세요.'
            echo '- 범위: 구조만 검사합니다. 제품·DB 결과는 **Build and test**에서 별도로 확인하세요.'
            echo '- 읽는 절차: 저장소 README의 **CI 실패 이유와 보고서 읽기** 항목'
          } >> "$GITHUB_STEP_SUMMARY"

  test-plan:
    name: Test partition plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify partition checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Read test groups
        id: plan
        run: python3 .github/scripts/ci_test_groups.py matrix

  product-tests:
    name: Product tests (${{ matrix.group }})
    needs: test-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    env:
      CI_TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Resolve Gradle dependencies
        shell: bash
        run: |
          gradle_log="$(mktemp)"
          trap 'rm -f "$gradle_log"' EXIT
          # 의존성 준비에서 저장소 요청 제한이 발생할 때만 재시도한다.
          for retry_delay in 15 35 0
          do
            gradle_status=0
            ./gradlew help --no-daemon --console=plain > "$gradle_log" 2>&1 || gradle_status=$?
            cat "$gradle_log"
            if (( gradle_status == 0 )); then
              break
            fi
            if (( retry_delay == 0 )) || ! grep -Eq 'Received status code 429 from server' "$gradle_log"; then
              exit "$gradle_status"
            fi
            wait_seconds=$((retry_delay + RANDOM % 10))
            echo "Gradle repository returned HTTP 429. Retrying in ${wait_seconds}s."
            sleep "$wait_seconds"
          done
      - name: Check Kotlin formatting
        if: matrix.group == 'general'
        run: ./gradlew ktlintCheck --no-daemon --console=plain --continue
      - name: Verify Docker for integration tests
        run: docker info
      - name: Build and run general and database tests
        if: matrix.group == 'general'
        id: general
        run: ./gradlew build test --rerun -x :architecture-tests:test -PciTestGroup="$CI_TEST_GROUP" --no-daemon --continue --stacktrace --console=plain
      - name: Run cluster test group
        if: matrix.group != 'general'
        id: cluster
        run: ./gradlew :app-api:test --rerun -PciTestGroup="$CI_TEST_GROUP" --no-daemon --stacktrace --console=plain
      - name: Record completed test reports
        run: python3 .github/scripts/ci_test_groups.py record --reports . --group "$CI_TEST_GROUP"
      - name: Upload group test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.group }}
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/*.xml
            **/build/reports/ktlint/**
            app-api/build/reports/ci-test-partition/**
            app-api/build/reports/aeron-funding/**
            app-api/build/reports/aeron-http/**
          if-no-files-found: warn
          retention-days: 7
      - name: Explain group result
        if: ${{ always() }}
        env:
          GENERAL_OUTCOME: ${{ steps.general.outcome }}
          CLUSTER_OUTCOME: ${{ steps.cluster.outcome }}
        run: |
          {
            echo "### 제품 검사 그룹: $CI_TEST_GROUP"
            echo "- 일반·DB 검사=$GENERAL_OUTCOME / 클러스터 검사=$CLUSTER_OUTCOME"
            echo "- 기준 커밋: $GITHUB_SHA"
            echo "- 보고서: test-reports-$CI_TEST_GROUP"
            echo '- skip·취소·보고서 부재를 통과로 세지 않습니다. Build and test에서 모든 그룹과 후보 합집합을 확인합니다.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build and test
    needs: [test-plan, product-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every test group to succeed
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          PRODUCT_RESULT: ${{ needs.product-tests.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$PRODUCT_RESULT" = success
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every group report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-reports-*
          path: ci-reports
          merge-multiple: false
      - name: Verify complete test coverage and results
        run: python3 .github/scripts/ci_test_groups.py verify --reports ci-reports
