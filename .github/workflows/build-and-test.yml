name: Build and Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # GitHub 캐시를 사용하고 PR에서는 기존 캐시만 읽는다.
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # PostgreSQL은 테스트 코드의 Testcontainers가 직접 시작·종료한다.
      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Build and run all tests
        # build에 모든 모듈의 test가 포함된다. 테스트 결과는 캐시로 대체하지 않는다.
        run: ./gradlew build --no-daemon --continue --stacktrace --rerun-tasks

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
