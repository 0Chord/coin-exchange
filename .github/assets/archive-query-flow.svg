<svg xmlns="http://www.w3.org/2000/svg" width="320" height="288" viewBox="0 0 320 288" role="img" aria-labelledby="title description">
  <title id="title">Archive 조회 경로</title>
  <desc id="description">자금과 매칭 Archive를 재생해 WAS가 주문과 원장을 PostgreSQL에 반영한다. 별도 공개 호가 작업은 매칭 Archive를 재생해 WAS 메모리를 갱신한다. 조회 API는 종류에 따라 PostgreSQL 또는 WAS 메모리를 읽는다.</desc>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202937; text-anchor: middle; }
    .node { fill: #eff4f9; stroke: #647791; }
    .edge { fill: none; stroke: #54657d; stroke-width: 1.4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#54657d"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="319" height="287" rx="7" fill="#fff" stroke="#d8dee7"/>

  <g class="edge">
    <path d="M82 52 V91"/>
    <path d="M217 52 V69 H102 V91"/>
    <path d="M238 52 V91"/>
    <path d="M82 128 V165"/>
    <path d="M238 128 V165"/>
    <path d="M82 202 V219 H137 V236"/>
    <path d="M238 202 V219 H183 V236"/>
  </g>
  <g class="node">
    <rect x="16" y="15" width="132" height="37" rx="5"/>
    <rect x="172" y="15" width="132" height="37" rx="5"/>
    <rect x="16" y="91" width="132" height="37" rx="5"/>
    <rect x="172" y="91" width="132" height="37" rx="5"/>
    <rect x="16" y="165" width="132" height="37" rx="5"/>
    <rect x="172" y="165" width="132" height="37" rx="5"/>
    <rect x="94" y="236" width="132" height="37" rx="5"/>
  </g>
  <text x="82" y="39">자금 Archive</text>
  <text x="238" y="39">매칭 Archive</text>
  <text x="82" y="115">주문·원장 반영</text>
  <text x="238" y="115">공개 호가 작업</text>
  <text x="82" y="189">PostgreSQL</text>
  <text x="238" y="189">WAS 메모리</text>
  <text x="160" y="260">WAS 조회 API</text>
</svg>
