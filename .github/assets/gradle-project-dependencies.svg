<svg xmlns="http://www.w3.org/2000/svg" width="320" height="399" viewBox="0 0 320 399" role="img" aria-labelledby="title description">
  <title id="title">Gradle 운영 모듈 직접 의존성</title>
  <desc id="description">화살표는 사용하는 모듈에서 직접 가져오는 모듈로 향한다. app-api는 implementation으로 domain-trading, domain-matching, domain-order, domain-ledger, domain-common에 의존한다. domain-trading은 api로 domain-matching, domain-order, domain-fee, domain-ledger, domain-common에 의존한다. domain-matching은 domain-order와 domain-common, domain-order는 domain-fee와 domain-common, domain-fee와 domain-ledger는 각각 domain-common에 api로 의존한다. domain-common의 프로젝트 의존성은 없다.</desc>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202937; }
    .heading, .source { font-weight: 650; }
    .module { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .target { text-anchor: middle; }
    .chip { fill: #eff4f9; stroke: #d8dee7; }
    .divider { fill: none; stroke: #d8dee7; }
  </style>
  <defs>
    <path id="arrow" d="M100 0 H117 M111 -5 L117 0 L111 5" fill="none" stroke="#54657d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect x=".5" y=".5" width="319" height="398" rx="7" fill="#fff" stroke="#d8dee7"/>
  <text class="heading" x="15" y="27">사용하는 모듈</text>
  <text class="heading" x="128" y="27">직접 가져오는 모듈</text>
  <path class="divider" d="M15 37 H305 M15 102 H305 M15 167 H305 M15 207 H305 M15 247 H305 M15 287 H305 M15 327 H305 M15 367 H305"/>

  <g id="app-api" class="module">
    <text class="source" x="15" y="75">app-api</text>
    <use href="#arrow" y="70"/>
    <rect class="chip" x="128" y="43" width="72" height="23" rx="4"/>
    <rect class="chip" x="205" y="43" width="81" height="23" rx="4"/>
    <rect class="chip" x="128" y="71" width="54" height="23" rx="4"/>
    <rect class="chip" x="187" y="71" width="58" height="23" rx="4"/>
    <rect class="chip" x="250" y="71" width="59" height="23" rx="4"/>
    <text class="target" x="164" y="60">trading</text>
    <text class="target" x="245.5" y="60">matching</text>
    <text class="target" x="155" y="88">order</text>
    <text class="target" x="216" y="88">ledger</text>
    <text class="target" x="279.5" y="88">common</text>
  </g>

  <g id="domain-trading" class="module">
    <text class="source" x="15" y="140">trading</text>
    <use href="#arrow" y="135"/>
    <rect class="chip" x="128" y="108" width="81" height="23" rx="4"/>
    <rect class="chip" x="214" y="108" width="54" height="23" rx="4"/>
    <rect class="chip" x="128" y="136" width="38" height="23" rx="4"/>
    <rect class="chip" x="171" y="136" width="58" height="23" rx="4"/>
    <rect class="chip" x="234" y="136" width="59" height="23" rx="4"/>
    <text class="target" x="168.5" y="125">matching</text>
    <text class="target" x="241" y="125">order</text>
    <text class="target" x="147" y="153">fee</text>
    <text class="target" x="200" y="153">ledger</text>
    <text class="target" x="263.5" y="153">common</text>
  </g>

  <g id="domain-matching" class="module">
    <text class="source" x="15" y="192">matching</text>
    <use href="#arrow" y="187"/>
    <rect class="chip" x="128" y="175" width="54" height="23" rx="4"/>
    <rect class="chip" x="187" y="175" width="59" height="23" rx="4"/>
    <text class="target" x="155" y="192">order</text>
    <text class="target" x="216.5" y="192">common</text>
  </g>

  <g id="domain-order" class="module">
    <text class="source" x="15" y="232">order</text>
    <use href="#arrow" y="227"/>
    <rect class="chip" x="128" y="215" width="38" height="23" rx="4"/>
    <rect class="chip" x="171" y="215" width="59" height="23" rx="4"/>
    <text class="target" x="147" y="232">fee</text>
    <text class="target" x="200.5" y="232">common</text>
  </g>

  <g id="domain-fee" class="module">
    <text class="source" x="15" y="272">fee</text>
    <use href="#arrow" y="267"/>
    <rect class="chip" x="128" y="255" width="59" height="23" rx="4"/>
    <text class="target" x="157.5" y="272">common</text>
  </g>

  <g id="domain-ledger" class="module">
    <text class="source" x="15" y="312">ledger</text>
    <use href="#arrow" y="307"/>
    <rect class="chip" x="128" y="295" width="59" height="23" rx="4"/>
    <text class="target" x="157.5" y="312">common</text>
  </g>

  <g id="domain-common" class="module">
    <text class="source" x="15" y="352">common</text>
    <text x="128" y="352">없음</text>
  </g>
  <text x="15" y="388"><tspan class="module">app-api</tspan> 외의 이름에는 <tspan class="module">domain-</tspan>을 붙입니다.</text>
</svg>
