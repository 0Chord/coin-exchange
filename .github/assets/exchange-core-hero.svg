<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title description">
  <title id="title">Exchange Core — Crypto trading backend</title>
  <desc id="description">A project cover showing a funds cluster and a matching cluster sending their logs to Archive.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#080f22"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <linearGradient id="rim" x2="1" y2="1">
      <stop stop-color="#4c6696"/>
      <stop offset=".6" stop-color="#283c62"/>
      <stop offset="1" stop-color="#396a73"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#7797ff"/>
      <stop offset="1" stop-color="#59e4cb"/>
    </linearGradient>
    <radialGradient id="blue-light">
      <stop stop-color="#3c64dc" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3c64dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint-light">
      <stop stop-color="#398f97" stop-opacity=".28"/>
      <stop offset="1" stop-color="#398f97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#9bbaff" stroke-opacity=".085"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="324" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="326" fill="url(#surface)"/>
    <ellipse cx="567" cy="86" rx="474" ry="266" fill="url(#blue-light)"/>
    <ellipse cx="1052" cy="185" rx="338" ry="240" fill="url(#mint-light)"/>
    <rect x="704" width="496" height="326" fill="url(#grid)"/>
    <path d="M704 35v254M719 35h-15v15m0 225v15h15m458-240V35h-15m0 255h15v-15"
          fill="none" stroke="#7899d4" stroke-opacity=".28"/>
    <path d="M726 216h32l22-21h24m329-160h-28l-17 17h-41m-261 242h58l21-21m246-60h26l24-24h27"
          fill="none" stroke="#7899d4" stroke-opacity=".27" stroke-linecap="round"/>
    <g fill="#8aa7e8" fill-opacity=".65">
      <circle cx="726" cy="216" r="2"/><circle cx="786" cy="294" r="2"/>
      <circle cx="1133" cy="35" r="2"/><circle cx="1188" cy="189" r="2"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="324" rx="26" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <g transform="translate(75 51)">
    <rect width="49" height="49" rx="13" fill="#122443" stroke="#47608d"/>
    <path d="M8 28h10l5-14 7 21 5-10h6" fill="none" stroke="url(#accent)"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="190" fill="#f4f7ff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="89" font-weight="750" letter-spacing="-5">Exchange <tspan fill="#a4deed">Core</tspan></text>
  <text x="76" y="241" fill="#b4c6e5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="33" font-weight="500" letter-spacing=".1">Crypto trading backend</text>

  <g fill="none" stroke="#516d9b" stroke-width="2">
    <path d="M831 185v22a10 10 0 0 0 10 10h67a9 9 0 0 1 9 9v8"/>
    <path d="M1062 185v22a10 10 0 0 1-10 10h-66a9 9 0 0 0-9 9v8"/>
  </g>
  <g transform="translate(747 59)">
    <rect width="168" height="127" rx="16" fill="#101c37" stroke="#49649c"/>
    <path d="M41 81 84 45l43 36" stroke="#7797ff" stroke-opacity=".67" stroke-width="2.2" fill="none"/>
    <circle cx="84" cy="45" r="21" fill="#7797ff" fill-opacity=".11"/>
    <g fill="#172d59" stroke="#7797ff" stroke-width="2.2">
      <circle cx="84" cy="45" r="14"/><circle cx="41" cy="81" r="12"/><circle cx="127" cy="81" r="12"/>
    </g>
    <g fill="#b5c4ff">
      <circle cx="84" cy="45" r="4"/><circle cx="41" cy="81" r="3"/><circle cx="127" cy="81" r="3"/>
    </g>
    <text x="84" y="114" text-anchor="middle" fill="#adc0ff" font-family="ui-monospace, Menlo, monospace"
          font-size="16" font-weight="650" letter-spacing="3">FUNDS</text>
  </g>

  <g transform="translate(978 59)">
    <rect width="168" height="127" rx="16" fill="#11263a" stroke="#36776f"/>
    <path d="M41 81 84 45l43 36" stroke="#59e4cb" stroke-opacity=".6" stroke-width="2.2" fill="none"/>
    <circle cx="84" cy="45" r="21" fill="#59e4cb" fill-opacity=".12"/>
    <g fill="#193d49" stroke="#59e4cb" stroke-width="2.2">
      <circle cx="84" cy="45" r="14"/><circle cx="41" cy="81" r="12"/><circle cx="127" cy="81" r="12"/>
    </g>
    <g fill="#a8f5e7">
      <circle cx="84" cy="45" r="4"/><circle cx="41" cy="81" r="3"/><circle cx="127" cy="81" r="3"/>
    </g>
    <text x="84" y="114" text-anchor="middle" fill="#97eddf" font-family="ui-monospace, Menlo, monospace"
          font-size="16" font-weight="650" letter-spacing="3">MATCH</text>
  </g>

  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M917 112h52m-8-6 8 6-8 6" stroke="#7797ff"/>
    <path d="M975 132h-51m8-6-8 6 8 6" stroke="#59e4cb"/>
  </g>

  <g transform="translate(865 232)">
    <rect width="162" height="51" rx="12" fill="#122138" stroke="#466881"/>
    <g fill="none" stroke="#9dd5e7" stroke-width="1.8">
      <ellipse cx="27" cy="17" rx="10" ry="4"/>
      <path d="M17 17v16c0 2 4.5 4 10 4s10-2 10-4V17M17 25c0 2 4.5 4 10 4s10-2 10-4"/>
    </g>
    <text x="51" y="32" fill="#bbd5e8" font-family="ui-monospace, Menlo, monospace"
          font-size="16" font-weight="650" letter-spacing="2.5">ARCHIVE</text>
  </g>
</svg>
