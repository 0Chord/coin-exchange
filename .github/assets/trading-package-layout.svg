<svg xmlns="http://www.w3.org/2000/svg" width="320" height="472" viewBox="0 0 320 472" role="img" aria-labelledby="title description">
  <title id="title">거래 패키지 구조</title>
  <desc id="description">app-api의 com.exchange.core.api 아래에는 Spring 구성 패키지 config와 거래 패키지 trading이 있다. trading에는 HTTP API, application과 그 하위 port, infrastructure가 있다. infrastructure의 하위 패키지는 aeron, codec, history, persistence, recovery다. 거래 도메인 모듈은 com.exchange.core 아래 trading, matching, order, fee, ledger, common으로 구성된다.</desc>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202937; }
    .heading { font-weight: 650; }
    .package { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .role { text-anchor: end; fill: #424f63; }
    .panel { fill: #fff; stroke: #d8dee7; }
    .header { fill: #eff4f9; }
    .branch { fill: none; stroke: #7a8ba3; stroke-width: 1.25; }
  </style>

