<svg xmlns="http://www.w3.org/2000/svg" width="320" height="725" viewBox="0 0 320 725" role="img" aria-labelledby="title description">
  <title id="title">주문 접수, 매칭·정산, 주문 조회</title>
  <desc id="description">자금의 예약과 접수 결과 기록을 기준으로 HTTP 202를 반환하며, 매칭 전달은 별도로 진행된다. 매칭의 체결 결과를 자금이 정산하고 적용한 연속 순번을 답하면 매칭이 이를 기록한 뒤 보관 결과를 정리한다. 조회가 준비된 상태에서 접수 순번을 아직 반영 중이면 GET 202, 정산까지 반영된 예에서는 GET 200으로 체결·정산 상태를 돌려준다.</desc>
  <style>
    text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202937; text-anchor: middle; }
    .heading { font-size: 16px; font-weight: 650; text-anchor: start; }
    .panel { fill: #fff; stroke: #d8dee7; }
    .actor { fill: #eff4f9; stroke: #647791; }
    .lifeline { fill: none; stroke: #aab7c8; stroke-dasharray: 3 3; }
    .messages { fill: none; stroke: #54657d; stroke-width: 1.35; }
    .messages path { marker-end: url(#arrow); }
    .reply { stroke-dasharray: 4 3; }
    .note { fill: #eff4f9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#54657d"/>
    </marker>
  </defs>

  <!-- HTTP 202 depends on committed funds acceptance. Dispatch to matching runs separately. -->
  <g>
    <rect class="panel" x=".5" y=".5" width="319" height="220" rx="7"/>
    <text class="heading" x="16" y="27">HTTP 접수</text>
    <g class="actor">
      <rect x="12" y="40" width="84" height="30" rx="5"/>
      <rect x="119" y="40" width="82" height="30" rx="5"/>
      <rect x="224" y="40" width="84" height="30" rx="5"/>
    </g>
    <text x="54" y="60">클라이언트</text>
    <text x="160" y="60">WAS</text>
    <text x="266" y="60">공통 자금</text>
    <path class="lifeline" d="M54 70 V208 M160 70 V208 M266 70 V208"/>
    <g class="messages">
      <path d="M54 100 H160"/>
      <path d="M160 126 H266"/>
      <path class="reply" d="M266 174 H160"/>
      <path class="reply" d="M160 200 H54"/>
    </g>
    <text x="107" y="94">주문 POST</text>
    <text x="213" y="120">접수 요청</text>
    <rect class="note" x="151" y="134" width="157" height="22" rx="4"/>
    <text x="229.5" y="150">커밋 후 예약·접수 기록</text>
    <text x="213" y="168">주문 ID·순번</text>
    <text x="107" y="194">202 접수</text>
  </g>

  <!-- Matching confirms fills. Funds settles in order. Matching records the acknowledgement before retiring results. -->
  <g transform="translate(0 234)">
    <rect class="panel" x=".5" y=".5" width="319" height="231" rx="7"/>
    <text class="heading" x="16" y="27">매칭·정산</text>
    <g class="actor">
      <rect x="13" y="40" width="98" height="30" rx="5"/>
      <rect x="209" y="40" width="98" height="30" rx="5"/>
    </g>
    <text x="62" y="60">공통 자금</text>
    <text x="258" y="60">담당 매칭</text>
    <path class="lifeline" d="M62 70 V221 M258 70 V221"/>
    <g class="messages">
      <path d="M62 101 H258"/>
      <path d="M258 147 H62"/>
      <path class="reply" d="M62 193 H258"/>
    </g>
    <text x="160" y="95">예약된 주문 전송</text>
    <rect class="note" x="158" y="108" width="150" height="22" rx="4"/>
    <text x="233" y="124">주문장 변경·체결 확정</text>
    <text x="160" y="141">체결 결과·결과 순번</text>
    <rect class="note" x="12" y="154" width="136" height="22" rx="4"/>
    <text x="80" y="170">잔고·수수료 정산</text>
    <text x="160" y="187">연속 적용 순번 확인</text>
    <rect class="note" x="158" y="200" width="150" height="22" rx="4"/>
    <text x="233" y="216">확인 기록·결과 정리</text>
  </g>

  <!-- 202 is conditional. The projector updates PostgreSQL independently of either GET. -->
  <g transform="translate(0 479)">
    <rect class="panel" x=".5" y=".5" width="319" height="245" rx="7"/>
    <text class="heading" x="16" y="27">주문 조회</text>
    <g class="actor">
      <rect x="12" y="40" width="84" height="30" rx="5"/>
      <rect x="119" y="40" width="82" height="30" rx="5"/>
      <rect x="218" y="40" width="96" height="30" rx="5"/>
    </g>
    <text x="54" y="60">클라이언트</text>
    <text x="160" y="60">WAS</text>
    <text x="266" y="60">PostgreSQL</text>
    <path class="lifeline" d="M54 70 V235 M160 70 V235 M266 70 V235"/>
    <g class="messages">
      <path d="M54 96 H160"/>
      <path class="reply" d="M160 122 H54"/>
      <path d="M160 151 H266"/>
      <path d="M54 177 H160"/>
      <path d="M160 203 H266"/>
      <path class="reply" d="M160 229 H54"/>
    </g>
    <text x="107" y="90">주문 GET</text>
    <text x="107" y="116">202 반영 중</text>
    <text x="213" y="145">체결·정산 반영</text>
    <text x="107" y="171">주문 GET</text>
    <text x="213" y="197">주문 상태 조회</text>
    <text x="107" y="223">200 상태 반환</text>
  </g>
</svg>
